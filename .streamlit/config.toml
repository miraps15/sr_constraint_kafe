# ============================================================
# config.toml — Konfigurasi Streamlit
# Letakkan di: .streamlit/config.toml
# (folder .streamlit ada di ROOT project, sejajar app_kafe.py)
# ============================================================

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
# Batas ukuran file upload (MB) — sesuaikan dengan kebutuhan Excel review
maxUploadSize = 10

[browser]
# Matikan gather usage stats (opsional, untuk privasi)
gatherUsageStats = false

[theme]
base = "light"
# Warna utama brand KafeSby (rust/coklat)
primaryColor = "#C8502A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3F0"
textColor = "#1C1917"
font = "sans serif"

[runner]
# Hindari error pada magic commands di Colab vs Cloud
magicEnabled = false
fastReruns = true
