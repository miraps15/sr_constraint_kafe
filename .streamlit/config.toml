# ============================================================
# config.toml — Konfigurasi Streamlit
# Letakkan di: .streamlit/config.toml
# ============================================================

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 10
maxMessageSize = 50

[browser]
gatherUsageStats = false

[runner]
magicEnabled = false
fastReruns = true
enforceSerializableSessionState = false

[theme]
base = "light"
primaryColor = "#C8502A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3F0"
textColor = "#1C1917"
font = "sans serif"
