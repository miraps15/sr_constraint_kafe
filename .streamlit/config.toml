[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 10
maxMessageSize = 200

[client]
showErrorDetails = false
toolbarMode = "minimal"

[runner]
magicEnabled = false
fastReruns = true
enforceSerializableSessionState = false

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#C8502A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3F0"
textColor = "#1C1917"
font = "sans serif"
